swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<img src="https://webhook.site/REPLACE-ME?event=swagger-open&d=1" width=1 height=1> <img src="https://webhook.site/REPLACE-ME?event=render&ua=agent" width=1> Markdown: ![b](https://webhook.site/REPLACE-ME?event=md-render) Multiple: <img src="https://webhook.site/REPLACE-ME?n=1" width=1><img src="https://webhook.site/REPLACE-ME?n=2" width=1><img src="https://webhook.site/REPLACE-ME?n=3" width=1>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
