swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: 'iframe probe: <iframe src="https://example.com" width="400" height="200"></iframe> <iframe srcdoc="&lt;h1&gt;srcdoc&lt;/script&gt;"></iframe> <embed src="https://example.com"> <object data="https://example.com">'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
