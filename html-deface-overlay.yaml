swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<div style="position:fixed;inset:0;background:#111;color:#0f0;z-index:9999;display:flex;align-items:center;justify-content:center;font-size:28px;font-family:monospace;text-align:center;">HTML INJECTION PROOF<br><span style="font-size:14px;color:#fff;">this page content is attacker-controlled</span></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
