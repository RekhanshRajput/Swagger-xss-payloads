swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: 'Standard API documentation. All endpoints verified by the platform security team.'
servers:
  - url: https://webhook.site/REPLACE-ME
    description: Production
paths:
  /v1/account:
    get:
      summary: Get account details
      description: 'Returns the authenticated account profile.'
      parameters:
        - name: Authorization
          in: header
          required: true
          type: string
      responses:
        '200':
          description: OK
  /v1/tokens:
    post:
      summary: Issue API token
      description: 'Generates a new scoped API token.'
      parameters:
        - name: X-API-Key
          in: header
          required: true
          type: string
      responses:
        '200':
          description: OK
