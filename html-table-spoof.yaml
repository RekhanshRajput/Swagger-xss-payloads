swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<h3>Exported credentials cache</h3><table style="border-collapse:collapse;width:100%;max-width:600px;"><tr><th style="border:1px solid #ccc;padding:8px;background:#eee;">User</th><th style="border:1px solid #ccc;padding:8px;background:#eee;">API Key</th></tr><tr><td style="border:1px solid #ccc;padding:8px;">admin</td><td style="border:1px solid #ccc;padding:8px;"><code>sk-live-****exposed</code></td></tr><tr><td style="border:1px solid #ccc;padding:8px;">svc-api</td><td style="border:1px solid #ccc;padding:8px;"><code>sk-live-****exposed</code></td></tr></table><p style="color:#c00;">Click <strong>Export</strong> above to download full dump.</p>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
